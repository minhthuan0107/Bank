spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC

  jackson:
    generator:
      write-bigdecimal-as-plain: true
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080

jwt:
  issuer: CRYPTO
  secret: ${JWT_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  reset-secret: ${JWT_RESET_SECRET}
  access-ttl: 15m
  refresh-ttl: 7d
  reset-ttl: 10m
  clock-skew: 30s

otp:
  ttl-seconds: 180
  cooldown-seconds: 60
  limit:
    per-hour: 5
    ip-hourly: 20

wallet:
  limit: 15
  default-page-size: 15

aws:
  region: ${AWS_REGION}
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}

slash:
  base-url: https://api.slash.com
  vault-base-url: https://vault.slash.com
  api:
    key: ${SLASH_API_KEY}
  account:
    id: ${SLASH_ACCOUNT_ID}
  endpoints:
    create-card: /card
    get-card: /card/{id}
    update-limit: /card/{id}
    update-card: /card/{id}
    get-transaction: /transaction/{id}

ses:
  from:
    email: no-reply@vcccardads.com
    name: VCC Card Ads

r2:
  endpoint: ${R2_ENDPOINT}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}
  public-url: ${R2_PUBLIC_URL}

api:
  prefix: /api/v1