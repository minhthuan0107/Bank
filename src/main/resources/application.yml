spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

    # DB hiện tại đã có sẵn bảng trước khi dùng Flyway
    baseline-on-migrate: true

    # Baseline ở version 0 để migration V1 trở đi vẫn được chạy
    baseline-version: 0

    # Kiểm tra checksum các migration đã chạy
    validate-on-migrate: true

    # Không cho phép Flyway clean nhầm DB
    clean-disabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  jackson:
    generator:
      write-bigdecimal-as-plain: true
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080

jwt:
  issuer: CRYPTO
  secret: ${JWT_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  reset-secret: ${JWT_RESET_SECRET}
  access-ttl: 15m
  refresh-ttl: 7d
  reset-ttl: 10m
  clock-skew: 30s

otp:
  ttl-seconds: 180
  cooldown-seconds: 60
  limit:
    per-hour: 5
    ip-hourly: 20

wallet:
  limit: 15
  default-page-size: 15

aws:
  region: ${AWS_REGION:ap-southeast-1}
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
resend:
  api-key: ${RESEND_API_KEY}
  from:
    email: no-reply@vcccardads.com
    name: VCC Card Ads

slash:
  base-url: https://api.slash.com
  vault-base-url: https://vault.slash.com
  api:
    key: ${SLASH_API_KEY}
  account:
    id: ${SLASH_ACCOUNT_ID}
  endpoints:
    create-card: /card
    get-card: /card/{id}
    update-limit: /card/{id}
    update-card: /card/{id}
    get-transaction: /transaction/{id}

ses:
  from:
    email: no-reply@vcccardads.com
    name: VCC Card Ads

r2:
  endpoint: ${R2_ENDPOINT}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}
  public-url: ${R2_PUBLIC_URL}

api:
  prefix: /api/v1